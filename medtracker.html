<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e1a">
<link rel="manifest" href="manifest.json">
<title>💊 MedTracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0a0e1a;--card:#151a2e;--card2:#1c2240;--primary:#6c63ff;--plight:#8b83ff;
--success:#00c853;--warn:#ff9100;--danger:#ff1744;--text:#e8eaf6;--text2:#9fa8c7;
--border:#2a3055;--radius:16px
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;
padding-bottom:80px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}

.header{background:linear-gradient(135deg,#1a1f3a,#252b50);padding:16px 20px;
position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}
.header h1{font-size:20px;font-weight:700}
.header .sub{font-size:12px;color:var(--text2);margin-top:2px}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);
border-top:1px solid var(--border);display:flex;z-index:100;
padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;padding:10px 0;text-align:center;color:var(--text2);font-size:10px;
border:none;background:none;cursor:pointer;transition:.2s;position:relative}
.nav-btn.active{color:var(--primary)}
.nav-btn svg{display:block;margin:0 auto 4px;width:24px;height:24px}

.page{display:none;padding:16px}.page.active{display:block}

.card{background:var(--card);border-radius:var(--radius);padding:16px;
margin-bottom:12px;border:1px solid var(--border)}
.card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

.time-group{margin-bottom:20px}
.time-label{font-size:14px;font-weight:600;color:var(--plight);margin-bottom:8px;
display:flex;align-items:center;gap:8px}
.time-label .dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}

.sc{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:8px;
border:1px solid var(--border);display:flex;align-items:center;gap:12px;transition:.3s}
.sc.confirmed{border-color:var(--success);background:rgba(0,200,83,.08)}
.sc.missed{border-color:var(--danger);background:rgba(255,23,68,.08)}
.sc.due{border-color:var(--warn);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,145,0,.3)}
50%{box-shadow:0 0 20px 4px rgba(255,145,0,.2)}}

.mc{width:6px;height:40px;border-radius:3px;flex-shrink:0}
.mi{flex:1;min-width:0}
.mn{font-weight:600;font-size:15px}
.md{font-size:13px;color:var(--text2);margin-top:2px}
.mx{font-size:11px;color:var(--text2);margin-top:2px;font-style:italic}

.cb{padding:10px 16px;border-radius:12px;border:none;font-weight:600;font-size:13px;
cursor:pointer;white-space:nowrap;transition:.2s}
.cb.take{background:var(--primary);color:#fff}
.cb.take:active{transform:scale(.95)}
.cb.taken{background:rgba(0,200,83,.2);color:var(--success)}

.ml{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;
border:1px solid var(--border);display:flex;align-items:center;gap:12px}
.ml .acts{display:flex;gap:8px}
.ml .acts button{background:var(--card2);border:1px solid var(--border);color:var(--text2);
width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px;
display:flex;align-items:center;justify-content:center}

.btn{padding:12px 24px;border-radius:12px;border:none;font-weight:600;font-size:14px;
cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn-p{background:var(--primary);color:#fff}
.btn-d{background:var(--danger);color:#fff}
.btn-o{background:none;border:1px solid var(--border);color:var(--text)}
.btn:active{transform:scale(.96)}

.fab{position:fixed;bottom:90px;right:20px;width:56px;height:56px;border-radius:50%;
background:var(--primary);color:#fff;border:none;font-size:28px;cursor:pointer;
box-shadow:0 4px 20px rgba(0,0,0,.4);z-index:50;display:flex;align-items:center;
justify-content:center}

.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;
align-items:flex-end;justify-content:center}
.mo.show{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:24px;width:100%;
max-width:500px;max-height:85vh;overflow-y:auto}
.modal h2{font-size:18px;margin-bottom:16px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
.fg input,.fg select,.fg textarea{width:100%;padding:12px;border-radius:10px;
border:1px solid var(--border);background:var(--card2);color:var(--text);
font-size:14px;outline:none}
.fg input:focus{border-color:var(--primary)}

.tc{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:4px;background:var(--card2);
border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:13px}
.chip button{background:none;border:none;color:var(--danger);cursor:pointer;
font-size:16px;padding:0 0 0 4px}
.add-t{background:none;border:1px dashed var(--border);color:var(--primary);
border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}

.days-row{display:flex;gap:6px}
.day-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
background:var(--card2);color:var(--text2);font-size:11px;font-weight:600;
cursor:pointer;transition:.2s}
.day-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.cr{display:flex;gap:8px}
.co{width:32px;height:32px;border-radius:50%;border:3px solid transparent;
cursor:pointer;transition:.2s}
.co.active{border-color:#fff;transform:scale(1.15)}

.si{display:flex;justify-content:space-between;align-items:center;padding:14px 0;
border-bottom:1px solid var(--border)}
.si:last-child{border:none}

.tog{width:48px;height:26px;border-radius:13px;background:var(--border);
position:relative;cursor:pointer;transition:.3s;border:none}
.tog.on{background:var(--primary)}
.tog::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;
background:#fff;top:2px;left:2px;transition:.3s}
.tog.on::after{left:24px}

.le{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;
display:flex;justify-content:space-between}

.ao{display:none;position:fixed;inset:0;background:rgba(10,14,26,.97);z-index:300;
flex-direction:column;align-items:center;justify-content:center;text-align:center;
padding:40px}
.ao.show{display:flex}
.ao h2{font-size:24px;margin-bottom:8px}
.ao .at{font-size:48px;font-weight:700;color:var(--warn);margin-bottom:16px}
.ao .am{margin-bottom:32px}
.ao .ami{font-size:18px;margin-bottom:8px}
.abtn{width:120px;height:120px;border-radius:50%;border:none;font-size:18px;
font-weight:700;cursor:pointer;animation:pulse 1.5s infinite}
.abtn.conf{background:var(--success);color:#fff}
.abtn.snz{background:var(--warn);color:#fff;width:80px;height:80px;font-size:14px;
margin-top:16px;animation:none}

.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty .icon{font-size:48px;margin-bottom:16px}

.dh{font-size:13px;color:var(--text2);margin-bottom:16px;display:flex;
justify-content:space-between;align-items:center}
.dn{display:flex;gap:8px}
.dn button{background:var(--card2);border:1px solid var(--border);color:var(--text);
width:32px;height:32px;border-radius:8px;cursor:pointer}

.sound-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.sound-opt{background:var(--card2);border:2px solid var(--border);border-radius:12px;
padding:14px 8px 10px;text-align:center;cursor:pointer;transition:.2s;position:relative}
.sound-opt.active{border-color:var(--primary);background:rgba(108,99,255,.12)}
.sound-opt .si2{font-size:24px;display:block;margin-bottom:4px}
.sound-opt .sn{font-size:10px;color:var(--text2);display:block}
.sound-opt.active .sn{color:var(--primary);font-weight:600}
.sound-prev{position:absolute;top:4px;right:4px;background:var(--primary);border:none;
color:#fff;width:22px;height:22px;border-radius:50%;font-size:9px;cursor:pointer;
display:flex;align-items:center;justify-content:center;line-height:1}
.sound-prev:active{transform:scale(.9)}
.vol-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.vol-row input[type=range]{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;
background:var(--border);outline:none}
.vol-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;
height:22px;border-radius:50%;background:var(--primary);cursor:pointer;
box-shadow:0 2px 8px rgba(108,99,255,.4)}
.vol-row input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
background:var(--primary);cursor:pointer;border:none}
.vol-val{font-size:13px;color:var(--text2);min-width:38px;text-align:right}
.cust-file{display:flex;align-items:center;gap:8px;background:var(--card2);
border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12px}
.cust-file .cf-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
color:var(--text)}
.cust-file button{background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);
background:var(--success);color:#fff;padding:14px 28px;border-radius:12px;
font-size:14px;font-weight:600;z-index:400;opacity:0;transition:opacity .3s;
pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.4);text-align:center}
.toast.show{opacity:1}
.days-info{font-size:11px;color:var(--primary);margin-top:6px}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="header">
<h1>💊 MedTracker</h1>
<div class="sub" id="hdr-sub">Loading...</div>
</div>

<div id="pg-schedule" class="page active"></div>
<div id="pg-meds" class="page"></div>
<div id="pg-history" class="page"></div>
<div id="pg-settings" class="page"></div>

<button class="fab" id="fab" onclick="openModal()">+</button>

<nav class="bottom-nav">
<button class="nav-btn active" onclick="go('schedule')" id="n-schedule">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
<line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
Schedule</button>
<button class="nav-btn" onclick="go('meds')" id="n-meds">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25
 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3"/>
</svg>Meds</button>
<button class="nav-btn" onclick="go('history')" id="n-history">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
History</button>
<button class="nav-btn" onclick="go('settings')" id="n-settings">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0
 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1
 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2
 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0
 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0
 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014
 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83
 2.83l-.06.06A1.65 1.65 0 0019.32 9a1.65 1.65 0 001.51 1H21a2 2 0 010
 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
Settings</button>
</nav>

<div class="mo" id="med-mo"><div class="modal" id="mo-c"></div></div>
<div class="ao" id="alarm-ov"></div>

<script>
// ===================== DATA =====================
var SK = {m:'mt_m', l:'mt_l', s:'mt_s'};
var COLORS = ['#6c63ff','#00c853','#ff9100','#ff1744','#00bcd4','#e91e63','#ffeb3b','#8bc34a'];
var DAYNAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function ld(k) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } }
function sv(k,v) { localStorage.setItem(k, JSON.stringify(v)); }

var meds = ld(SK.m) || [];
var log = ld(SK.l) || {};
var S = ld(SK.s) || {
  topic:'', alertMin:60, sound:true, vib:true, caregiver:'',
  notifyConf:true, notifyMiss:true, snooze:10, patient:'Patient',
  alarmSound:'classic', alarmVol:80, customFile:''
};

function sM() { sv(SK.m, meds); }
function sL() { sv(SK.l, log); }
function sS() { sv(SK.s, S); }

// ===================== UTIL =====================
function gid() { return Date.now().toString(36) + Math.random().toString(36).substr(2,5); }
function today() { return new Date().toISOString().slice(0,10); }
function pad(n) { return String(n).padStart(2,'0'); }
function f12(t) {
  var p = t.split(':');
  var h = parseInt(p[0]);
  var m = p[1];
  var a = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + m + ' ' + a;
}
function fD(s) {
  return new Date(s + 'T12:00:00').toLocaleDateString('en-US',
    {weekday:'short', month:'short', day:'numeric'});
}
function tM(t) { var p = t.split(':'); return parseInt(p[0]) * 60 + parseInt(p[1]); }
function mN() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }

function getSched(ds) {
  ds = ds || today();
  var dow = new Date(ds + 'T12:00:00').getDay();
  var sc = {};
  meds.forEach(function(med) {
    if (med.active === false) return;
    if (med.days && med.days.length > 0 && med.days.length < 7 && med.days.indexOf(dow) === -1) return;
    (med.times || []).forEach(function(t) {
      if (!sc[t]) sc[t] = [];
      sc[t].push(med);
    });
  });
  return Object.keys(sc).sort().map(function(k) { return [k, sc[k]]; });
}

function lk(d,t,id) { return d + '|' + t + '|' + id; }
function isConf(d,t,id) { return !!log[lk(d,t,id)]; }
function doConf(d,t,id) {
  log[lk(d,t,id)] = {at: new Date().toISOString(), time:t, medId:id, date:d};
  sL();
}

// ===================== AUDIO ENGINE =====================
var actx = null;
var aInt = null;
var isAl = false;
var custEl = null;
var custURL = null;

function gAC() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

var ALARMS = {
  classic: {
    name: 'Classic Alarm', icon: '⏰',
    play: function(vol) {
      var c = gAC(), n = c.currentTime;
      for (var i = 0; i < 12; i++) {
        var o = c.createOscillator(), g = c.createGain();
        o.connect(g); g.connect(c.destination);
        o.type = 'square';
        o.frequency.value = (i % 2) ? 780 : 1000;
        var t = n + i * 0.14;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol * 0.4, t + 0.008);
        g.gain.setValueAtTime(vol * 0.4, t + 0.09);
        g.gain.linearRampToValueAtTime(0, t + 0.13);
        o.start(t); o.stop(t + 0.14);
      }
    }
  },
  siren: {
    name: 'Urgent Siren', icon: '🚨',
    play: function(vol) {
      var c = gAC(), n = c.currentTime;
      for (var w = 0; w < 2; w++) {
        var o = c.createOscillator(), g = c.createGain();
        o.connect(g); g.connect(c.destination);
        o.type = 'sawtooth';
        g.gain.value = vol * 0.28;
        var base = n + w * 1.0;
        o.frequency.setValueAtTime(400, base);
        o.frequency.exponentialRampToValueAtTime(1500, base + 0.5);
        o.frequency.exponentialRampToValueAtTime(400, base + 1.0);
        g.gain.setValueAtTime(vol * 0.28, base);
        g.gain.linearRampToValueAtTime(0, base + 0.98);
        o.start(base); o.stop(base + 1.0);
      }
    }
  },
  medical: {
    name: 'Medical Alert', icon: '🏥',
    play: function(vol) {
      var c = gAC(), n = c.currentTime;
      var times = [0, 0.22, 0.44, 0.88, 1.1, 1.32];
      times.forEach(function(off) {
        var o = c.createOscillator(), g = c.createGain();
        o.connect(g); g.connect(c.destination);
        o.type = 'sine'; o.frequency.value = 925;
        var t = n + off;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol * 0.5, t + 0.01);
        g.gain.setValueAtTime(vol * 0.5, t + 0.12);
        g.gain.linearRampToValueAtTime(0, t + 0.17);
        o.start(t); o.stop(t + 0.2);
      });
    }
  },
  buzzer: {
    name: 'Harsh Buzzer', icon: '📢',
    play: function(vol) {
      var c = gAC(), n = c.currentTime;
      for (var i = 0; i < 5; i++) {
        var o = c.createOscillator(), o2 = c.createOscillator();
        var g = c.createGain();
        o.connect(g); o2.connect(g); g.connect(c.destination);
        o.type = 'square'; o.frequency.value = 175;
        o2.type = 'square'; o2.frequency.value = 178;
        var t = n + i * 0.4;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol * 0.32, t + 0.01);
        g.gain.setValueAtTime(vol * 0.32, t + 0.25);
        g.gain.linearRampToValueAtTime(0, t + 0.32);
        o.start(t); o.stop(t + 0.35);
        o2.start(t); o2.stop(t + 0.35);
      }
    }
  },
  escalating: {
    name: 'Escalating', icon: '📈',
    play: function(vol) {
      var c = gAC(), n = c.currentTime;
      for (var i = 0; i < 10; i++) {
        var o = c.createOscillator(), g = c.createGain();
        o.connect(g); g.connect(c.destination);
        o.type = i < 5 ? 'sine' : i < 8 ? 'triangle' : 'square';
        o.frequency.value = 300 + i * 80;
        var t = n + i * 0.2;
        var v = vol * (0.06 + i * 0.035);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(Math.min(v, vol * 0.45), t + 0.01);
        g.gain.setValueAtTime(Math.min(v, vol * 0.45), t + 0.12);
        g.gain.linearRampToValueAtTime(0, t + 0.18);
        o.start(t); o.stop(t + 0.2);
      }
    }
  },
  chime: {
    name: 'Gentle Chime', icon: '🔔',
    play: function(vol) {
      var c = gAC(), n = c.currentTime;
      [659,784,659,784,659,784,880,784].forEach(function(f, i) {
        var o = c.createOscillator(), g = c.createGain();
        o.connect(g); g.connect(c.destination);
        o.frequency.value = f; o.type = 'sine';
        var t = n + i * 0.25;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol * 0.3, t + 0.05);
        g.gain.linearRampToValueAtTime(0, t + 0.2);
        o.start(t); o.stop(t + 0.25);
      });
    }
  }
};

function playAlarmOnce() {
  if (!S.sound) return;
  var vol = (S.alarmVol != null ? S.alarmVol : 80) / 100;
  var sel = S.alarmSound || 'classic';
  if (sel === 'custom') return;
  if (ALARMS[sel]) ALARMS[sel].play(vol);
}

function playCustLoop() {
  if (!custURL || !isAl) return;
  if (custEl) { try { custEl.pause(); } catch(e) {} }
  custEl = new Audio(custURL);
  custEl.volume = (S.alarmVol != null ? S.alarmVol : 80) / 100;
  custEl.onended = function() {
    if (isAl) {
      if (S.vib && navigator.vibrate) navigator.vibrate([300,100,300]);
      setTimeout(playCustLoop, 1200);
    }
  };
  custEl.play().catch(function(e) { console.warn('Custom audio play failed:', e); });
}

function prevSound(key) {
  stopA();
  var vol = (S.alarmVol != null ? S.alarmVol : 80) / 100;
  if (key === 'custom' && custURL) {
    var a = new Audio(custURL);
    a.volume = vol;
    a.play().catch(function(){});
    setTimeout(function() { try { a.pause(); a.currentTime = 0; } catch(e) {} }, 5000);
  } else if (ALARMS[key]) {
    ALARMS[key].play(vol);
  }
}

function startA() {
  if (isAl) return;
  isAl = true;
  if (S.sound) {
    var sel = S.alarmSound || 'classic';
    if (sel === 'custom' && custURL) {
      playCustLoop();
    } else {
      playAlarmOnce();
      aInt = setInterval(function() {
        playAlarmOnce();
        if (S.vib && navigator.vibrate) navigator.vibrate([300,100,300]);
      }, 3000);
    }
  }
  if (S.vib && navigator.vibrate) navigator.vibrate([500,200,500,200,500,200,500]);
}

function stopA() {
  isAl = false;
  if (aInt) { clearInterval(aInt); aInt = null; }
  if (custEl) { try { custEl.pause(); custEl.currentTime = 0; } catch(e) {} custEl = null; }
  if (navigator.vibrate) navigator.vibrate(0);
}

// ===================== CUSTOM AUDIO STORAGE =====================
var ADB = {
  db: null,
  open: function() {
    return new Promise(function(res, rej) {
      var r = indexedDB.open('MedTrackerAudio', 1);
      r.onupgradeneeded = function(e) { e.target.result.createObjectStore('files'); };
      r.onsuccess = function(e) { ADB.db = e.target.result; res(); };
      r.onerror = function(e) { rej(e); };
    });
  },
  save: function(blob) {
    return new Promise(function(res, rej) {
      var tx = ADB.db.transaction('files', 'readwrite');
      tx.objectStore('files').put(blob, 'alarm');
      tx.oncomplete = function() { res(); };
      tx.onerror = function(e) { rej(e); };
    });
  },
  load: function() {
    return new Promise(function(res) {
      var tx = ADB.db.transaction('files', 'readonly');
      var r = tx.objectStore('files').get('alarm');
      r.onsuccess = function() { res(r.result || null); };
      r.onerror = function() { res(null); };
    });
  },
  del: function() {
    return new Promise(function(res) {
      var tx = ADB.db.transaction('files', 'readwrite');
      tx.objectStore('files').delete('alarm');
      tx.oncomplete = function() { res(); };
      tx.onerror = function() { res(); };
    });
  }
};

function initAudio() {
  return ADB.open().then(function() {
    return ADB.load();
  }).then(function(blob) {
    if (blob) {
      if (custURL) URL.revokeObjectURL(custURL);
      custURL = URL.createObjectURL(blob);
    }
  }).catch(function(e) {
    console.warn('IndexedDB init:', e);
  });
}

function uploadSound(input) {
  var file = input.files[0];
  if (!file) return;
  if (!file.type.match(/^audio\//)) {
    alert('Please select an audio file (MP3, WAV, OGG, M4A, etc.)');
    input.value = ''; return;
  }
  if (file.size > 10 * 1024 * 1024) {
    alert('File too large — please use a file under 10 MB.');
    input.value = ''; return;
  }
  ADB.save(file).then(function() {
    S.customFile = file.name;
    S.alarmSound = 'custom';
    sS();
    if (custURL) URL.revokeObjectURL(custURL);
    custURL = URL.createObjectURL(file);
    rSett();
    setTimeout(function() { prevSound('custom'); }, 300);
  }).catch(function(e) {
    alert('Error saving file. Try a smaller file.');
    console.error(e);
  });
  input.value = '';
}

function delCustSound() {
  if (!confirm('Remove custom sound?')) return;
  ADB.del().then(function() {
    S.customFile = '';
    if (S.alarmSound === 'custom') S.alarmSound = 'classic';
    sS();
    if (custURL) { URL.revokeObjectURL(custURL); custURL = null; }
    rSett();
  }).catch(function(e) { console.error(e); });
}

// ===================== NTFY =====================
function notify(title, msg, pri) {
  var topic = (S.topic || '').trim();
  if (!topic) return Promise.resolve(false);
  pri = pri || 3;

  return fetch('https://ntfy.sh/', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      topic: topic,
      title: title,
      message: msg,
      priority: pri,
      tags: [pri >= 4 ? 'warning' : 'pill']
    })
  }).then(function(r) {
    if (!r.ok) {
      return r.text().then(function(t) {
        console.error('ntfy error:', r.status, t);
        return false;
      });
    }
    console.log('ntfy sent OK');
    return true;
  }).catch(function(e) {
    console.error('ntfy fetch error:', e);
    return false;
  });
}

function testN() {
  var topic = (S.topic || '').trim();
  if (!topic) { alert('Enter a ntfy.sh topic first!'); return; }

  S.topic = topic;
  sS();

  var msg = 'Test from MedTracker for ' + (S.patient || 'patient') +
    ' at ' + new Date().toLocaleTimeString();

  fetch('https://ntfy.sh/', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      topic: topic,
      title: 'MedTracker Test',
      message: msg,
      priority: 3,
      tags: ['pill', 'test_tube']
    })
  }).then(function(r) {
    if (r.ok) {
      return r.json().then(function(data) {
        alert(
          'SUCCESS!\n\n' +
          'Topic: ' + topic + '\n' +
          'Message ID: ' + (data.id || 'unknown') + '\n\n' +
          'Check the ntfy app now!'
        );
      });
    } else {
      return r.text().then(function(body) {
        alert(
          'FAILED - HTTP ' + r.status + '\n\n' +
          'Response: ' + body + '\n' +
          'Topic: ' + topic
        );
      });
    }
  }).catch(function(err) {
    alert(
      'CONNECTION ERROR\n\n' +
      'Error: ' + err.message + '\n\n' +
      'Topic: ' + topic
    );
  });
}

var CP = 'schedule';
var VD = today();

function go(p) {
  CP = p;
  document.querySelectorAll('.page').forEach(function(e) { e.classList.remove('active'); });
  document.getElementById('pg-' + p).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('n-' + p).classList.add('active');
  document.getElementById('fab').style.display = (p === 'meds') ? '' : 'none';
  render();
}

function render() {
  try {
    var fn = {schedule: rSched, meds: rMeds, history: rHist, settings: rSett};
    if (fn[CP]) fn[CP]();
    var sc = getSched();
    var tot = 0, conf = 0;
    sc.forEach(function(pair) {
      tot += pair[1].length;
      pair[1].forEach(function(m) { if (isConf(today(), pair[0], m.id)) conf++; });
    });
    document.getElementById('hdr-sub').textContent = fD(today()) + ' \u2022 ' + conf + '/' + tot + ' doses confirmed';
  } catch(e) {
    console.error('Render error:', e);
    document.getElementById('hdr-sub').textContent = 'Error - check console';
  }
}

// ===================== SCHEDULE =====================
function rSched() {
  var pg = document.getElementById('pg-schedule');
  var sc = getSched(VD);
  var isT = (VD === today());
  var nm = mN();

  var h = '<div class="dh"><span>' + fD(VD) + (isT ? ' (Today)' : '') + '</span>' +
    '<div class="dn"><button onclick="chD(-1)">\u25C0</button>' +
    '<button onclick="VD=today();rSched()">\u29BF</button>' +
    '<button onclick="chD(1)">\u25B6</button></div></div>';

  if (!sc.length) {
    h += '<div class="empty"><div class="icon">\uD83D\uDC8A</div><p>No meds scheduled' +
      (isT ? ' today' : '') + '.</p><br><button class="btn btn-p" onclick="go(\'meds\')">Add Medications</button></div>';
    pg.innerHTML = h; return;
  }

  sc.forEach(function(pair) {
    var time = pair[0], ms = pair[1];
    var tm = tM(time);
    var past = isT && nm > tm + 5;
    var due = isT && Math.abs(nm - tm) <= 5;
    var allC = ms.every(function(m) { return isConf(VD, time, m.id); });

    h += '<div class="time-group"><div class="time-label">' +
      '<span class="dot" style="background:' +
      (allC ? 'var(--success)' : due ? 'var(--warn)' : past ? 'var(--danger)' : 'var(--primary)') +
      '"></span>' + f12(time) +
      (allC ? ' \u2705' : due ? ' \u23F0 NOW' : (past && !allC) ? ' \u26A0\uFE0F' : '') + '</div>';

    ms.forEach(function(med) {
      var cf = isConf(VD, time, med.id);
      var mi = past && !cf;
      var cls = cf ? 'confirmed' : due ? 'due' : mi ? 'missed' : '';

      h += '<div class="sc ' + cls + '">' +
        '<div class="mc" style="background:' + (med.color || COLORS[0]) + '"></div>' +
        '<div class="mi"><div class="mn">' + med.name + '</div>' +
        '<div class="md">' + (med.dose || '') + '</div>' +
                (med.treatment ? '<div class="mx">For: ' + med.treatment + '</div>' : '') +
        (med.instr ? '<div class="mx">' + med.instr + '</div>' : '') + '</div>';

      if (cf) {
        var le = log[lk(VD, time, med.id)];
        var ct2 = le ? new Date(le.at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : '';
        h += '<div class="cb taken">\u2713 ' + ct2 + '</div>';
      } else if (isT || VD <= today()) {
        h += '<button class="cb take" onclick="hConf(\'' + VD + '\',\'' + time + '\',\'' + med.id + '\')">Take</button>';
      }
      h += '</div>';
    });
    h += '</div>';
  });
  pg.innerHTML = h;
}

function chD(d) {
  var dt = new Date(VD + 'T12:00:00');
  dt.setDate(dt.getDate() + d);
  VD = dt.toISOString().slice(0, 10);
  rSched();
}

function hConf(ds, time, id) {
  var med = meds.find(function(m) { return m.id === id; });
  if (!med) return;
  doConf(ds, time, id);
  stopA();
  render();
  if (S.notifyConf && S.topic) {
    notify('\u2705 ' + S.patient + ' took medication',
      med.name + ' ' + (med.dose || '') + ' confirmed at ' + f12(time) +
      ' (' + new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) + ')', 2);
  }
}

function expD() {

function impD(ev) {
  var f = ev.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(e) {
    try {
      var d = JSON.parse(e.target.result);
      if (d.meds) { meds = d.meds; sM(); }
      if (d.log) { log = d.log; sL(); }
      if (d.settings) { Object.keys(d.settings).forEach(function(k) { S[k] = d.settings[k]; }); sS(); }
      alert('Imported!');
      render();
    } catch(err) { alert('Invalid file'); }
  };
  r.readAsText(f);
  ev.target.value = '';
}

function showToast(msg, dur) {
  dur = dur || 2500;
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, dur);
}

function openModal(eid) {
  var med = null;
  if (eid) med = meds.find(function(m) { return m.id === eid; });
  var isE = !!med;

  _ms = {
    name: med ? med.name : '',
    dose: med ? (med.dose || '') : '',
    rxnum: med ? (med.rxnum || '') : '',
    treatment: med ? (med.treatment || '') : '',
    instr: med ? (med.instr || '') : '',
    times: med ? (med.times || []).slice() : [],
    days: med ? (med.days || [0,1,2,3,4,5,6]).slice() : [0,1,2,3,4,5,6],
    color: med ? (med.color || COLORS[0]) : COLORS[0]
  };

  function captureFields() {
    var n = document.getElementById('f-name');
    var d = document.getElementById('f-dose');
    var ins = document.getElementById('f-instr');
    if (n) _ms.name = n.value;
    if (d) _ms.dose = d.value;
    if (ins) _ms.instr = ins.value;
  }

  function getDaysLabel() {
    if (_ms.days.length === 0) return 'No days selected!';
    if (_ms.days.length === 7) return 'Every day (daily)';
    var sorted = _ms.days.slice().sort();
    return sorted.map(function(d) { return DAYNAMES[d]; }).join(', ');
  }

  function rM() {
    var timeChips = _ms.times.map(function(t, i) {
      return '<div class="chip">' + f12(t) +
        '<button onclick="capF();_ms.times.splice(' + i + ',1);window._rMM()">&times;</button></div>';
    }).join('');

    var dayBtns = DAYNAMES.map(function(d, i) {
      var isActive = _ms.days.indexOf(i) >= 0;
      return '<button type="button" class="day-btn ' + (isActive ? 'active' : '') + '"' +
        ' onclick="capF();var x=_ms.days.indexOf(' + i + ');' +
        'if(x>=0)_ms.days.splice(x,1);else _ms.days.push(' + i + ');window._rMM()">' +
        d + '</button>';
    }).join('');

    var colorDots = COLORS.map(function(c) {
      return '<div class="co ' + (_ms.color === c ? 'active' : '') + '"' +
        ' style="background:' + c + '"' +
        ' onclick="capF();_ms.color=\'' + c + '\';window._rMM()"></div>';
    }).join('');

    var activeToggle = '';
    if (isE) {
      activeToggle = '<div class="si" style="border-top:1px solid var(--border);' +
        'margin-top:8px;padding-top:14px">' +
        '<div style="font-size:14px">Active</div>' +
        '<button class="tog ' + (med.active !== false ? 'on' : '') +
        '" id="f-act" onclick="this.classList.toggle(\'on\')"></button></div>';
    }

    var daysLabel = getDaysLabel();
    var daysColor = _ms.days.length === 0 ? 'var(--danger)' : 'var(--primary)';

    document.getElementById('mo-c').innerHTML =
      '<h2>' + (isE ? 'Edit' : 'Add') + ' Medication</h2>' +

      '<div class="fg"><label>Name *</label>' +
      '<input id="f-name" value="' + _ms.name.replace(/"/g, '&quot;') +
      '" placeholder="e.g. Ibuprofen"></div>' +

      '<div class="fg"><label>Dose</label>' +
      '<input id="f-dose" value="' + _ms.dose.replace(/"/g, '&quot;') +
      '" placeholder="e.g. 800mg, 1 tablet, 5ml"></div>' +

            '<div class="fg"><label>RX Number</label>' +
      '<input id="f-rxnum" value="' + _ms.rxnum.replace(/"/g, '&quot;') +
      '" placeholder="e.g. RX-7234891"></div>' +

      '<div class="fg"><label>Treatment For</label>' +
      '<input id="f-treatment" value="' + _ms.treatment.replace(/"/g, '&quot;') +
      '" placeholder="e.g. Pain, Inflammation, Blood pressure"></div>' +

      '<div class="fg"><label>Additional Info (optional)</label>' +
      '<input id="f-instr" value="' + _ms.instr.replace(/"/g, '&quot;') +
      '" placeholder="e.g. Take with food, on empty stomach"></div>' +

      '<div class="fg"><label>Schedule Times *</label>' +
      '<div class="tc">' + timeChips +
      '<button class="add-t" onclick="capF();' +
      'var el=document.getElementById(\'nt\');el.style.display=\'block\';el.focus();el.click()">' +
      '+ Add Time</button></div>' +
      (_ms.times.length === 0 ?
        '<div style="font-size:11px;color:var(--danger);margin-top:4px">' +
        'Tap "+ Add Time" to set when to take this med</div>' : '') +
      '<input type="time" id="nt" style="display:none;margin-top:8px"' +
      ' onchange="if(this.value){capF();_ms.times.push(this.value);_ms.times.sort();' +
      'this.value=\'\';this.style.display=\'none\';window._rMM()}">' +
      '</div>' +

      '<div class="fg"><label>Days of Week</label>' +
      '<div class="days-row">' + dayBtns + '</div>' +
      '<div class="days-info" style="color:' + daysColor + '">' +
      (_ms.days.length === 7 ? '\u2713 ' : _ms.days.length === 0 ? '\u26A0 ' : '') +
      daysLabel + '</div>' +
      '<div style="margin-top:6px;display:flex;gap:8px">' +
      '<button style="font-size:11px;padding:4px 10px;border-radius:8px;border:1px solid var(--border);' +
      'background:var(--card2);color:var(--primary);cursor:pointer"' +
      ' onclick="capF();_ms.days=[0,1,2,3,4,5,6];window._rMM()">All Days</button>' +
      '<button style="font-size:11px;padding:4px 10px;border-radius:8px;border:1px solid var(--border);' +
      'background:var(--card2);color:var(--text2);cursor:pointer"' +
      ' onclick="capF();_ms.days=[1,2,3,4,5];window._rMM()">Weekdays</button>' +
      '<button style="font-size:11px;padding:4px 10px;border-radius:8px;border:1px solid var(--border);' +
      'background:var(--card2);color:var(--text2);cursor:pointer"' +
      ' onclick="capF();_ms.days=[];window._rMM()">None</button>' +
      '</div></div>' +

      '<div class="fg"><label>Color</label>' +
      '<div class="cr">' + colorDots + '</div></div>' +

      activeToggle +

      '<div style="display:flex;gap:8px;margin-top:20px">' +
      '<button class="btn btn-o" style="flex:1;justify-content:center"' +
      ' onclick="closeM()">Cancel</button>' +
      '<button class="btn btn-p" style="flex:1;justify-content:center"' +
      ' onclick="saveMF(\'' + (eid || '') + '\')">' +
      (isE ? '\u2713 Save Changes' : '\u2713 Add Medication') + '</button></div>';
  }

  // Global function to capture fields before any re-render
    window.capF = function() {
    var n = document.getElementById('f-name');
    var d = document.getElementById('f-dose');
    var rx = document.getElementById('f-rxnum');
    var tr = document.getElementById('f-treatment');
    var ins = document.getElementById('f-instr');
    if (n) _ms.name = n.value;
    if (d) _ms.dose = d.value;
    if (rx) _ms.rxnum = rx.value;
    if (tr) _ms.treatment = tr.value;
    if (ins) _ms.instr = ins.value;
  };

  window._rMM = function() {
    captureFields();
    rM();
  };

  rM();
  document.getElementById('med-mo').classList.add('show');

  // Auto-focus the name field after a brief delay
  setTimeout(function() {
    var n = document.getElementById('f-name');
    if (n && !_ms.name) n.focus();
  }, 300);
}

function closeM() {
  document.getElementById('med-mo').classList.remove('show');
}

function saveMF(eid) {
  // Capture latest field values
  if (window.capF) window.capF();

    var name = _ms.name.trim();
    var dose = _ms.dose.trim();
    var rxnum = _ms.rxnum.trim();
    var treatment = _ms.treatment.trim();
    var instr = _ms.instr.trim();

  if (!name) {
    alert('Please enter the medication name');
    var n = document.getElementById('f-name');
    if (n) n.focus();
    return;
  }
  if (!_ms.times.length) {
    alert('Please add at least one schedule time.\n\nTap "+ Add Time" and select when this medication should be taken.');
    return;
  }
  if (!_ms.days.length) {
    if (!confirm('No days are selected. This medication won\'t appear on any day.\n\nDo you want to set it to daily?')) {
      return;
    }
    _ms.days = [0,1,2,3,4,5,6];
  }

    var d = {
    name: name,
    dose: dose,
    rxnum: rxnum,
    treatment: treatment,
    instr: instr,
    times: _ms.times.slice(),
    days: _ms.days.slice().sort(),
    color: _ms.color,
    active: true
  };

  if (eid) {
    var i = -1;
    meds.forEach(function(m, idx) { if (m.id === eid) i = idx; });
    if (i >= 0) {
      var at = document.getElementById('f-act');
      d.active = at ? at.classList.contains('on') : true;
      d.id = eid;
      meds[i] = d;
      sM();
      closeM();
      render();
      showToast('\u2713 ' + name + ' updated!');
    }
  } else {
    d.id = gid();
    meds.push(d);
    sM();
    closeM();
    render();
    showToast('\u2713 ' + name + ' added!');
  }
}

function delMed(id) {
  var m = null;
  meds.forEach(function(x) { if (x.id === id) m = x; });
  if (!m) return;
  if (!confirm('Delete "' + m.name + '"?\n\nThis cannot be undone.')) return;
  meds = meds.filter(function(x) { return x.id !== id; });
  sM();
  render();
  showToast(m.name + ' deleted');
}

// ===================== ALARM CHECK =====================
var missN = {};
var snzU = {};

function chkAlarm() {
  var ds = today();
  var sc = getSched(ds);
  var nm = mN();
  var shouldA = false;
  var aMeds = [];

  sc.forEach(function(pair) {
    var time = pair[0], ms = pair[1];
    var tm = tM(time);

    if (Math.abs(nm - tm) <= 1) {
      var unc = ms.filter(function(m) { return !isConf(ds, time, m.id); });
      if (unc.length > 0) {
        var sk = ds + '|' + time;
        if (snzU[sk] && nm < snzU[sk]) return;
        shouldA = true;
        aMeds.push({time: time, meds: unc});
      }
    }

    var am = S.alertMin || 60;
    if (nm > tm + am && S.notifyMiss !== false) {
      ms.forEach(function(med) {
        var mk = lk(ds, time, med.id);
        if (!isConf(ds, time, med.id) && !missN[mk]) {
          missN[mk] = true;
          notify('\u26A0\uFE0F MISSED: ' + med.name,
            (S.patient || 'Patient') + ' has NOT confirmed ' + med.name + ' ' +
            (med.dose || '') + ' scheduled for ' + f12(time) + '. ' + am + '+ min have passed.', 5);
        }
      });
    }
  });

  if (shouldA) {
    showAO(aMeds);
    startA();
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('\uD83D\uDC8A Medication Time!', {
        body: aMeds.map(function(g) {
          return g.meds.map(function(m) { return m.name; }).join(', ');
        }).join(' | '),
        requireInteraction: true
      });
    }
  }
  if (CP === 'schedule' && VD === today()) rSched();
}

function showAO(am) {
  var ov = document.getElementById('alarm-ov');
  var h = '<h2>\u23F0 Medication Time!</h2>' +
    '<div class="at">' + am.map(function(g) { return f12(g.time); }).join(', ') + '</div><div class="am">';
  am.forEach(function(g) {
    g.meds.forEach(function(m) {
      h += '<div class="ami" style="color:' + (m.color || COLORS[0]) + '">' +
        m.name + (m.dose ? ' \u2014 ' + m.dose : '') +
        (m.instr ? '<br><small style="color:var(--text2)">' + m.instr + '</small>' : '') + '</div>';
    });
  });
  h += '</div><button class="abtn conf" onclick="confAll()">\u2713 TAKEN</button>' +
    '<button class="abtn snz" onclick="snoozeA()">Snooze<br>' + (S.snooze || 10) + 'm</button>';

  window._cAM = am;
  ov.innerHTML = h;
  ov.classList.add('show');

  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(function(){});
  }
}

function confAll() {
  var ds = today();
  if (window._cAM) {
    window._cAM.forEach(function(g) {
      g.meds.forEach(function(m) {
        if (!isConf(ds, g.time, m.id)) {
          doConf(ds, g.time, m.id);
          if (S.notifyConf && S.topic)
            notify('\u2705 ' + S.patient + ' took ' + m.name,
              m.name + ' ' + (m.dose || '') + ' confirmed at ' + f12(g.time), 2);
        }
      });
    });
  }
  stopA();
  document.getElementById('alarm-ov').classList.remove('show');
  render();
}

function snoozeA() {
  var ds = today();
  var sm = S.snooze || 10;
  if (window._cAM) {
    window._cAM.forEach(function(g) {
      snzU[ds + '|' + g.time] = mN() + sm;
    });
  }
  stopA();
  document.getElementById('alarm-ov').classList.remove('show');
}

// ===================== INIT =====================
function init() {
  try {
    if ('Notification' in window && Notification.permission === 'default')
      Notification.requestPermission();

    render();

    setInterval(chkAlarm, 30000);
    setTimeout(chkAlarm, 2000);

    document.addEventListener('click', function ia() {
      try { gAC(); } catch(e) {}
      document.removeEventListener('click', ia);
    }, {once: true});

    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) { chkAlarm(); render(); }
    });

    document.getElementById('med-mo').addEventListener('click', function(e) {
      if (e.target === this) closeM();
    });

    setInterval(function() {
      var h = new Date().getHours(), m = new Date().getMinutes();
      if (h === 0 && m === 0) { missN = {}; snzU = {}; }
    }, 60000);

    // Init audio DB in background
    initAudio().then(function() {
      console.log('Audio DB ready');
    }).catch(function(e) {
      console.warn('Audio DB init failed (non-critical):', e);
    });

    if (!S.topic && !meds.length) {
      setTimeout(function() {
        if (confirm('Welcome! Set up caregiver notifications first?')) go('settings');
      }, 500);
    }
  } catch(e) {
    console.error('Init error:', e);
    document.getElementById('hdr-sub').textContent = 'Error: ' + e.message;
  }
}

init();
</script>
